[project]
name = "reasoning-manipulation"
version = "0.1.0"
description = "Adversarial Manipulation of Reasoning Models using Internal Representations"
authors = [
  {name = "Kureha Yamaguchi", email = "ky295@cantab.ac.uk"},
  {name = "Benjamin Etheridge"},
  {name = "Andy Arditi"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "einops>=0.8.1",
    "ipykernel>=6.29.5",
    "kernels>=0.9.0",
    "nnsight>=0.4.7",
    "nvidia-ml-py>=12.575.51",
    "pandas>=2.3.0",
    "protobuf>=6.31.1",
    "questionary>=2.1.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.7.0",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.0",
    "strong-reject",
    "torch",
    "transformers==4.55.0",
    "triton>=3.3.1",
    "vllm==0.10.1",
    "wandb>=0.20.1",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "ruff>=0.12.0",
    "ty>=0.0.1a11",
]

[tool.uv.sources]
strong-reject = { git = "https://github.com/dsbowen/strong_reject.git", rev = "main" }